name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  BAKE_FILE: deployment/docker/docker-bake.hcl

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Run hadolint
        run: nix develop --command hadolint deployment/docker/Dockerfile

      - name: Run actionlint
        run: nix develop --command actionlint

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/bake-action@v7
        with:
          files: ${{ env.BAKE_FILE }}
          targets: image
          load: true
          set: |
            image.platform=${{ matrix.platform }}
            image.tags=nix-devcontainer:test
            image.cache-from=type=gha,scope=${{ matrix.platform }}
            image.cache-to=type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Test
        run: docker run --rm -v "$PWD/tests:/tests:ro" nix-devcontainer:test nix shell nixpkgs#bats -c bats /tests

  release:
    needs: [lint, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create Release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          manifest-file: .github/config/release-please-manifest.json
          config-file: .github/config/release-please-config.json
          target-branch: main

  publish:
    needs: release
    if: needs.release.outputs.release_created
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: bake
        uses: docker/bake-action@v7
        with:
          files: ${{ env.BAKE_FILE }}
          targets: image
          set: |
            image.platform=${{ matrix.platform }}
            image.tags=
            image.output=type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
            image.cache-from=type=gha,scope=${{ matrix.platform }}
            image.cache-to=type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Test the pushed image
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          digest="$(jq -r '.image["containerimage.digest"]' <<< "$METADATA")"
          docker run --rm -v "$PWD/tests:/tests:ro" "${IMAGE}@${digest}" nix shell nixpkgs#bats -c bats /tests

      - name: Export digest
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="$(jq -r '.image["containerimage.digest"]' <<< "$METADATA")"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  manifest:
    needs: [release, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          MAJOR: ${{ needs.release.outputs.major }}
          MINOR: ${{ needs.release.outputs.minor }}
          PATCH: ${{ needs.release.outputs.patch }}
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.MAJOR }}
            type=raw,value=${{ env.MAJOR }}.${{ env.MINOR }}
            type=raw,value=${{ env.MAJOR }}.${{ env.MINOR }}.${{ env.PATCH }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
